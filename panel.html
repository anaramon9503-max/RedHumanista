<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#087f98">
  <title>Red Humanista | Panel</title>
  <link rel="stylesheet" href="./asset/styles.css?v=6">
  <link rel="stylesheet" href="./asset/panel-app.css?v=6">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="config.js"></script>
</head>
<body class="panel-page">
  <section id="loginView" class="login-wrap">
    <div class="brand login-brand">
      <img src="./asset/logo-humanista.png" alt="Red de Atención Psicológica Humanista" class="brand-logo">
      <h1>Panel Humanista</h1>
      <p>Acceso para administración y profesionales.</p>
    </div>
    <div class="card login-card">
      <div id="loginMessage" class="message hidden"></div>
      <div class="field"><label>Correo</label><input id="loginEmail" type="email" autocomplete="email" placeholder="correo@ejemplo.com"></div>
      <div class="field"><label>Contraseña</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <button id="loginBtn" class="btn btn-primary btn-block">Entrar</button>
    </div>
  </section>

  <div id="appView" class="hidden">
    <header class="topbar">
      <div class="container topbar-inner">
        <div class="topbrand">
          <img src="./asset/logo-humanista.png" alt="Red Humanista" class="mini-logo">
          <div><strong>Red Humanista</strong><small id="roleLabel">Panel</small></div>
        </div>
        <div class="user-box">
          <span class="email" id="userEmail"></span>
          <button id="logoutBtn" class="btn btn-light btn-compact">Salir</button>
        </div>
      </div>
    </header>

    <main class="container panel-shell">
      <div class="dashboard-grid">
        <nav class="sidebar" id="sidebar" aria-label="Navegación principal"></nav>
        <section class="content">
          <div id="globalMessage" class="message hidden"></div>
          <div id="page"></div>
        </section>
      </div>
    </main>
  </div>

  <div id="moreMenu" class="more-menu hidden" aria-hidden="true"></div>
  <div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
  <script type="module" src="panel.js?v=6"></script>
</body>
</html>
